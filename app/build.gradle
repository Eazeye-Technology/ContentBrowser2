plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.txkj.contentbrowser2'
    compileSdk {
        version = release(35) //release(36) //(35) //
    }

    defaultConfig {
        applicationId "com.txkj.contentbrowser2"
        minSdk 21 //23 //24
        targetSdk 35//36 //35 //
        versionCode 16062
        versionName "1.60.62"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

/*
https://java.tutorialink.com/android-file-listfiles-returns-only-subdirectories/
My fault, I missed something. In Android 11, you can only access media files. In my case,
the files in external storage were not media files, so they were not displayed.
But after changing the target api to 29 (Android 10) everything works fine.
Thanks to everyone who tried to help!
 */
        //-----------------------
        //added for compiling

        //for jni so
        ndk {
            //https://www.cnblogs.com/zhangzhxb/p/14493600.html
            //'armeabi-v7a',
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11 //don't use VERSION_8
        targetCompatibility JavaVersion.VERSION_11
    }

    //---------------
    //added for BuildConfig Not Found
    buildFeatures {
        buildConfig = true
    }

    //-----------------------
    //added for compiling

    //for dependencies
    configurations {
        all {
            exclude module: 'httpclient'
            exclude module: 'commons-logging'
        }
    }

    //for jni so
    //https://www.jianshu.com/p/12e9077d3fe9
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    //for AnExplorer
    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
//
    //1.4.1
    //implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
//    testImplementation 'junit:junit:4.13.2'
//    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    //implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'














